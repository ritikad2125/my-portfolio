<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#217346"/>
      <stop offset="1" stop-color="#1a5c38"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1f14" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#f3f5f4"/>
  <!-- window chrome -->
  <g filter="url(#sh)">
    <rect x="24" y="20" width="1152" height="520" rx="12" fill="#ffffff" stroke="#e2e6e4"/>
  </g>
  <rect x="24" y="20" width="1152" height="46" rx="12" fill="#1f2d27"/>
  <rect x="24" y="44" width="1152" height="22" fill="#1f2d27"/>
  <circle cx="48" cy="43" r="6" fill="#ff5f57"/>
  <circle cx="68" cy="43" r="6" fill="#febc2e"/>
  <circle cx="88" cy="43" r="6" fill="#28c840"/>
  <text x="600" y="48" fill="#cdd6d1" font-size="14" text-anchor="middle" font-weight="600">Chemistry_AI_QC_Tracker.xlsx — Innodata QC</text>
  <!-- toolbar -->
  <rect x="24" y="66" width="1152" height="30" fill="#f7f9f8"/>
  <text x="44" y="86" fill="#5b6b63" font-size="12">File   Home   Insert   Formulas   Data   Review   View</text>
  <text x="1140" y="86" fill="#217346" font-size="12" text-anchor="end" font-weight="700">AutoSave ●</text>

  <!-- column header band -->
  <g font-size="12.5" font-weight="700" fill="#ffffff">
    <rect x="24"   y="96" width="52"  height="34" fill="url(#hdr)"/><text x="50"  y="118" text-anchor="middle">#</text>
    <rect x="76"   y="96" width="300" height="34" fill="url(#hdr)"/><text x="90"  y="118">Question</text>
    <rect x="376"  y="96" width="250" height="34" fill="url(#hdr)"/><text x="390" y="118">Solution</text>
    <rect x="626"  y="96" width="140" height="34" fill="url(#hdr)"/><text x="640" y="118">Final Answer</text>
    <rect x="766"  y="96" width="100" height="34" fill="url(#hdr)"/><text x="816" y="118" text-anchor="middle">LaTeX</text>
    <rect x="866"  y="96" width="130" height="34" fill="url(#hdr)"/><text x="931" y="118" text-anchor="middle">Constrained</text>
    <rect x="996"  y="96" width="95"  height="34" fill="url(#hdr)"/><text x="1043" y="118" text-anchor="middle">AI-Gen</text>
    <rect x="1091" y="96" width="85"  height="34" fill="url(#hdr)"/><text x="1133" y="118" text-anchor="middle">Status</text>
  </g>

  <!-- row data -->
  <g font-size="12" fill="#2a3a33">
    <!-- row backgrounds -->
    <rect x="24" y="130" width="1152" height="62" fill="#ffffff"/>
    <rect x="24" y="192" width="1152" height="62" fill="#f4f8f5"/>
    <rect x="24" y="254" width="1152" height="62" fill="#ffffff"/>
    <rect x="24" y="316" width="1152" height="62" fill="#f4f8f5"/>
    <rect x="24" y="378" width="1152" height="62" fill="#ffffff"/>
    <rect x="24" y="440" width="1152" height="62" fill="#f4f8f5"/>

    <!-- R1 -->
    <text x="50" y="165" text-anchor="middle" fill="#7a8b82">01</text>
    <text x="90" y="156">Balance the redox reaction MnO₄⁻ + Fe²⁺</text>
    <text x="90" y="174" fill="#6a7a71">→ Mn²⁺ + Fe³⁺ in acidic medium.</text>
    <text x="390" y="156">Half-reaction method; balance O</text>
    <text x="390" y="174" fill="#6a7a71">with H₂O, H with H⁺, charge with e⁻.</text>
    <text x="640" y="165" font-weight="600">5 Fe²⁺ / 1 MnO₄⁻</text>

    <!-- R2 -->
    <text x="50" y="227" text-anchor="middle" fill="#7a8b82">02</text>
    <text x="90" y="218">Compute ΔG° for a cell with E° = 1.10 V,</text>
    <text x="90" y="236" fill="#6a7a71">n = 2 electrons transferred.</text>
    <text x="390" y="218">ΔG° = −nFE° ; F = 96485 C/mol.</text>
    <text x="640" y="227" font-weight="600">−212.3 kJ/mol</text>

    <!-- R3 -->
    <text x="50" y="289" text-anchor="middle" fill="#7a8b82">03</text>
    <text x="90" y="280">Assign IUPAC name to CH₃CH(OH)CH₂CHO.</text>
    <text x="90" y="298" fill="#6a7a71">Identify principal chain + suffix priority.</text>
    <text x="390" y="280">Aldehyde &gt; alcohol in priority;</text>
    <text x="390" y="298" fill="#6a7a71">number from CHO carbon.</text>
    <text x="640" y="289" font-weight="600">3-hydroxybutanal</text>

    <!-- R4 -->
    <text x="50" y="351" text-anchor="middle" fill="#7a8b82">04</text>
    <text x="90" y="342">Radical-pair hyperfine: eigenvalues of</text>
    <text x="90" y="360" fill="#6a7a71">H for I₂ = 1 (spin-1 nucleus).</text>
    <text x="390" y="342">Build operators in (S₁,S₂,I₁,I₂)</text>
    <text x="390" y="360" fill="#6a7a71">basis; diagonalize 24×24 block.</text>
    <text x="640" y="351" font-weight="600">λ = +0.83, …</text>

    <!-- R5 -->
    <text x="50" y="413" text-anchor="middle" fill="#7a8b82">05</text>
    <text x="90" y="404">First-order kinetics: half-life for</text>
    <text x="90" y="422" fill="#6a7a71">k = 2.8×10⁻³ s⁻¹.</text>
    <text x="390" y="404">t₁/₂ = ln2 / k.</text>
    <text x="640" y="413" font-weight="600">247.5 s</text>

    <!-- R6 (flagged / needs rework) -->
    <text x="50" y="475" text-anchor="middle" fill="#7a8b82">06</text>
    <text x="90" y="466">Hybridization &amp; geometry of XeF₄;</text>
    <text x="90" y="484" fill="#6a7a71">justify lone-pair placement.</text>
    <text x="390" y="466" fill="#b23b2e">Solution incomplete — missing</text>
    <text x="390" y="484" fill="#b23b2e">bond-angle justification.</text>
    <text x="640" y="475" font-weight="600" fill="#b23b2e">sp³d² (pending)</text>
  </g>

  <!-- rubric check marks -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <!-- LaTeX column (x=816) -->
    <text x="816" y="166" fill="#217346">✓</text>
    <text x="816" y="228" fill="#217346">✓</text>
    <text x="816" y="290" fill="#217346">✓</text>
    <text x="816" y="352" fill="#217346">✓</text>
    <text x="816" y="414" fill="#217346">✓</text>
    <text x="816" y="476" fill="#c9962b">!</text>
    <!-- Constrained column (x=931) -->
    <text x="931" y="166" fill="#217346">✓</text>
    <text x="931" y="228" fill="#217346">✓</text>
    <text x="931" y="290" fill="#217346">✓</text>
    <text x="931" y="352" fill="#217346">✓</text>
    <text x="931" y="414" fill="#217346">✓</text>
    <text x="931" y="476" fill="#b23b2e">✗</text>
    <!-- AI-Gen column (x=1043) -->
    <text x="1043" y="166" fill="#217346">✓</text>
    <text x="1043" y="228" fill="#217346">✓</text>
    <text x="1043" y="290" fill="#7a8b82">—</text>
    <text x="1043" y="352" fill="#217346">✓</text>
    <text x="1043" y="414" fill="#217346">✓</text>
    <text x="1043" y="476" fill="#217346">✓</text>
  </g>

  <!-- status pills -->
  <g font-size="10.5" font-weight="700" text-anchor="middle">
    <rect x="1098" y="152" width="70" height="20" rx="10" fill="#dff3e6"/><text x="1133" y="166" fill="#1a7a42">PASS</text>
    <rect x="1098" y="214" width="70" height="20" rx="10" fill="#dff3e6"/><text x="1133" y="228" fill="#1a7a42">PASS</text>
    <rect x="1098" y="276" width="70" height="20" rx="10" fill="#dff3e6"/><text x="1133" y="290" fill="#1a7a42">PASS</text>
    <rect x="1098" y="338" width="70" height="20" rx="10" fill="#dff3e6"/><text x="1133" y="352" fill="#1a7a42">PASS</text>
    <rect x="1098" y="400" width="70" height="20" rx="10" fill="#dff3e6"/><text x="1133" y="414" fill="#1a7a42">PASS</text>
    <rect x="1098" y="462" width="70" height="20" rx="10" fill="#fde8e4"/><text x="1133" y="476" fill="#b23b2e">REWORK</text>
  </g>

  <!-- grid lines -->
  <g stroke="#e4ebe7" stroke-width="1">
    <line x1="24" y1="130" x2="1176" y2="130"/>
    <line x1="24" y1="192" x2="1176" y2="192"/>
    <line x1="24" y1="254" x2="1176" y2="254"/>
    <line x1="24" y1="316" x2="1176" y2="316"/>
    <line x1="24" y1="378" x2="1176" y2="378"/>
    <line x1="24" y1="440" x2="1176" y2="440"/>
    <line x1="24" y1="502" x2="1176" y2="502"/>
    <line x1="76" y1="96" x2="76" y2="502"/>
    <line x1="376" y1="96" x2="376" y2="502"/>
    <line x1="626" y1="96" x2="626" y2="502"/>
    <line x1="766" y1="96" x2="766" y2="502"/>
    <line x1="866" y1="96" x2="866" y2="502"/>
    <line x1="996" y1="96" x2="996" y2="502"/>
    <line x1="1091" y1="96" x2="1091" y2="502"/>
  </g>

  <!-- footer status bar -->
  <rect x="24" y="502" width="1152" height="38" rx="0" fill="#f7f9f8"/>
  <rect x="24" y="528" width="1152" height="12" rx="6" fill="#ffffff"/>
  <text x="44" y="525" font-size="11.5" fill="#5b6b63">Sheet: Retro-QC   |   Records: 248   |   Pass rate:</text>
  <text x="358" y="525" font-size="11.5" fill="#217346" font-weight="700">96.4%</text>
  <text x="1156" y="525" font-size="11.5" fill="#5b6b63" text-anchor="end">Ready</text>
</svg>
